openapi: 3.1.0
info:
  title: Tax (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Tax interface, distilled from the harvested OpenAPI of 51 providers in the APIs.io catalog.
    Not a product: no one serves this API. It is the shape the market already shares, measured, so that providers,
    agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /tax-calculations:
    post:
      operationId: createTaxCalculation
      summary: Create a tax calculation
      tags:
      - Tax Calculations
      x-commons-tier: core
      x-commons-share: 0.833
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/TaxCalculation'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /tax-transactions:
    get:
      operationId: listTaxTransactions
      summary: List tax transactions
      tags:
      - Tax Transactions
      x-commons-tier: core
      x-commons-share: 0.667
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id002
                  $ref: '#/components/schemas/TaxTransaction'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createTaxTransaction
      summary: Create a tax transaction
      tags:
      - Tax Transactions
      x-commons-tier: core
      x-commons-share: 0.667
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /tax-transactions/{tax_transaction_id}:
    parameters:
    - $ref: '#/components/parameters/tax_transaction_id'
    get:
      operationId: getTaxTransaction
      summary: Get a tax transaction
      tags:
      - Tax Transactions
      x-commons-tier: core
      x-commons-share: 0.583
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
    patch:
      operationId: updateTaxTransaction
      summary: Update a tax transaction
      tags:
      - Tax Transactions
      x-commons-tier: extended
      x-commons-share: 0.417
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
    delete:
      operationId: deleteTaxTransaction
      summary: Delete a tax transaction
      tags:
      - Tax Transactions
      x-commons-tier: extended
      x-commons-share: 0.25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
components:
  schemas:
    TaxCalculation:
      $ref: ./schema/tax_calculation.json
    TaxTransaction:
      $ref: ./schema/tax_transaction.json
  parameters:
    tax_calculation_id:
      name: tax_calculation_id
      in: path
      required: true
      schema:
        type: string
    tax_transaction_id:
      name: tax_transaction_id
      in: path
      required: true
      schema:
        type: string
