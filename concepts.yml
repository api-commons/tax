context: tax
name: Tax
intro: >-
  The common tax vocabulary -- the tax calculations made on a sale, the transactions committed
  for reporting, the jurisdictions and rates that apply, the exemption certificates that waive
  tax and the filings that report it -- distilled from the APIs that already exist. Payroll
  taxes belong to the payroll context.
tags: [Tax, Tax Compliance, Sales Tax, VAT, Tax Automation, Indirect Tax, E-Invoicing, Tax Calculation]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, transaction_id, calculation_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, filing_status]
  currency: [currency_code]
  amount: [total, total_amount, amount_total, taxable_amount, line_amount, subtotal]
  tax_amount: [total_tax, tax, amount_to_collect, tax_collectable, total_tax_amount, tax_amount_total, tax_calculated]
  customer_id: [customer, customer_code, exemption_no, buyer, purchaser]
  date: [transaction_date, document_date, tax_date, invoice_date, sale_date]

concepts:
  tax_calculation:
    path: /tax-calculations
    segments: [calculations, calculation, calculate, "taxes@calculate|calculations", quotes@tax, estimates@tax, tax_calculations, rates@lookup]
    aliases:
      line_items: [lines, items, line_items_list, transaction_lines]
      ship_to: [to_address, destination, ship_to_address, to]
      ship_from: [from_address, origin, ship_from_address, from]
      breakdown: [tax_breakdown, jurisdictions, details, tax_details, summary]
  tax_transaction:
    path: /tax-transactions
    segments: [transactions, transaction, documents@tax, orders@tax|transactions, refunds@tax|transactions, commits]
    aliases:
      code: [transaction_code, document_code, order_id, reference, transaction_reference]
      committed: [is_committed, status_committed]
      line_items: [lines, items]
      type: [transaction_type, document_type, kind]
  # tax_rate, exemption_certificate and tax_filing were measured and dropped: 3, 2 and 2 readable
  # providers -- jurisdictions, nexus, exemptions and VAT obligations are each modelled by a
  # handful of engines (Avalara, Kintsugi, HMRC) in their own way.

exclude:
  tax_calculation:
    cadana: /tax/calculate is a payroll calculation
    wingspan: /collaborator/1099/calculate is a contractor 1099 calculation
    flatin-pt: /imt/calculate is a property-transfer tax quote

findings:
  - "A tax transaction agrees on id, amount, date and type -- the committed record a tax engine
    reports from."
  - "A tax calculation agrees on nothing: sales-tax engines, VAT services and global tax APIs each
    take addresses, lines and exemptions in their own shape, and return a breakdown in another."
  - "Tax is thin as published OpenAPI (51 providers, 15 mapped), and splits by country -- US sales
    tax, EU VAT and the UK's Making Tax Digital are three different vocabularies."
decisions:
  - "Payroll and contractor tax belong to payroll; property-transfer tax quotes are excluded."
  - "Calculations are `/tax-calculations` and committed transactions `/tax-transactions`: payments
    and banking own the bare words."
  - "Rates, exemption certificates and filings were measured and dropped."
